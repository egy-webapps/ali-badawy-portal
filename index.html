<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البوابة الرقمية الخدمية - النائب علي بدوي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <div class="max-w-md mx-auto p-4 bg-white min-h-screen shadow-lg">
        <h1 class="text-xl font-bold text-center text-blue-900 mb-6">البوابة الرقمية لخدمة مواطني الدائرة</h1>
        
        <form id="requestForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">الاسم الثلاثي</label>
                <input type="text" id="fullName" required class="w-full mt-1 p-2 border rounded-md" placeholder="أدخل اسمك كما هو بالبطاقة">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">الرقم القومي (14 رقم)</label>
                <input type="text" id="nationalId" maxlength="14" required class="w-full mt-1 p-2 border rounded-md" placeholder="30707544700987">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">رقم الهاتف / الواتساب</label>
                <input type="text" id="phone" required class="w-full mt-1 p-2 border rounded-md" placeholder="0111588755555">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">القطاع</label>
                <select id="sector" class="w-full mt-1 p-2 border rounded-md">
                    <option value="خدمات عامة">خدمات عامة</option>
                    <option value="صحة">صحة</option>
                    <option value="تعليم">تعليم</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">تفاصيل الطلب</label>
                <textarea id="details" required class="w-full mt-1 p-2 border rounded-md" placeholder="اكتب تفاصيل طلبك هنا..."></textarea>
            </div>

            <button type="submit" class="w-full bg-blue-900 text-white p-3 rounded-md font-bold hover:bg-blue-800">
                إرسال الطلب والحصول على رقم مرجعي
            </button>
        </form>

        <div id="result" class="mt-4 text-center font-bold text-green-600"></div>
    </div>

    <script>
         const SUPABASE_URL = 'https://qnkdfrxavrztgyhrodxl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_xGfJoG2Cuxj9T-B6dC_gnw_FwFAwo78';
       


        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('requestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const nationalId = document.getElementById('nationalId').value;
            const phone = document.getElementById('phone').value;
            const sector = document.getElementById('sector').value;
            const details = document.getElementById('details').value;

            if (nationalId.length !== 14) {
                alert('تأكد من صحة الرقم القومي (14 رقم)');
                return;
            }

            const { data, error } = await supabaseClient.rpc('submit_request', {
                p_name: fullName,
                p_nid: nationalId,
                p_phone: phone,
                p_location: 'المنيا',
                p_sector: sector,
                p_details: details,
                p_file: null
            });

            if (error) {
                alert('حدث خطأ أثناء إرسال الطلب: ' + error.message);
            } else {
                document.getElementById('result').innerText = 'تم إرسال طلبك بنجاح! رقم التذكرة المرجعي: ' + data;
                document.getElementById('requestForm').reset();
            }
        });
    </script>
</body>
</html>
