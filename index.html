<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; text-align: center; }
        .header { background: #0d47a1; color: white; padding: 20px; font-weight: bold; font-size: 20px; }
        .card { background: white; margin: 15px; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { display: block; width: 85%; margin: 10px auto; padding: 15px; border-radius: 10px; text-decoration: none; font-weight: bold; border-right: 6px solid #0d47a1; background: #fff; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-green { border-right-color: #2e7d32; }
    </style>
</head>
<body>
    <div class="header">بوابة النائب علي بدوي الإلكترونية</div>
    <div class="card">
        <h2 style="color:#0d47a1;">أهلاً بكم في المنصة الرسمية</h2>
        <p>صوتكم أمانة.. ومطلبكم حق</p>
    </div>
    <a href="#" class="btn btn-green">🟢 تقديم طلب خدمة جديد</a>
    <a href="#" class="btn">🔵 متابعة حالة طلبك</a>
    <a href="#" class="btn" style="border-right-color: #ef6c00;">🟠 سجل الإنجازات</a>
</body>
</html>
