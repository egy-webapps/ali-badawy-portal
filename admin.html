<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المكتب - النائب علي بدوي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8f9fa; color: #333; }
        .sidebar { background: #1e3c72; color: white; min-height: 100vh; padding: 20px; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .table th { background-color: #1e3c72; color: white; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول لمكتب النائب -->
    <div id="loginSection" class="container mt-5" style="max-width: 450px;">
        <div class="card card-custom p-4">
            <h3 class="text-center fw-bold text-primary mb-4">تسجيل دخول المكتب</h3>
            <p class="text-center text-muted small mb-4">مخصص لفريق عمل وإدارة مكتب النائب علي بدوي</p>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">البريد الإلكتروني للمكتب</label>
                    <input type="email" id="email" class="form-control" value="office@badawi.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">كلمة المرور</label>
                    <input type="password" id="password" class="form-control" placeholder="أدخل كلمة المرور" required>
                </div>
                <button type="submit" id="loginBtn" class="btn btn-primary w-100 fw-bold py-2">دخول لوحة التحكم</button>
            </form>
            <div id="loginError" class="alert alert-danger mt-3 d-none text-center"></div>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية (مخفية حتى يتم تسجيل الدخول) -->
    <div id="dashboardSection" class="container-fluid d-none">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <h4 class="fw-bold text-center py-3 border-bottom">إدارة الطلبات</h4>
                <p class="small text-center text-warning mb-4">office@badawi.com</p>
                <button onclick="logout()" class="btn btn-outline-light w-100 btn-sm mt-3">تسجيل الخروج</button>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold text-primary">متابعة طلبات المواطنين الواردة</h2>
                    <button onclick="loadRequests()" class="btn btn-secondary btn-sm">🔄 تحديث البيانات</button>
                </div>

                <div class="card card-custom p-3">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>رقم التذكرة</th>
                                    <th>اسم المواطن</th>
                                    <th>الرقم القومي</th>
                                    <th>القطاع</th>
                                    <th>رقم الهاتف</th>
                                    <th>تاريخ التقديم</th>
                                    <th>الحالة</th>
                                </tr>
                            </thead>
                            <tbody id="requestsTableBody">
                                <tr><td colspan="7" class="text-center py-4">جاري تحميل الطلبات...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qnkdfrxavrztgyhrodxl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFua2RmcnhhdnJ6dGd5aHJvZHhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDf...';
        const supabaseClient = supabase.createClient(SUPABASE_URL, 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFua2RmcnhhdnJ6dGd5aHJvZHhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDf...');

        // تسجيل الدخول
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('loginError');
            
            errDiv.classList.add('d-none');

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                errDiv.textContent = 'خطأ في البريد الإلكتروني أو كلمة المرور!';
                errDiv.classList.remove('d-none');
            } else {
                document.getElementById('loginSection').classList.add('d-none');
                document.getElementById('dashboardSection').classList.remove('d-none');
                loadRequests();
            }
        });

        // جلب الطلبات لقاعدة البيانات
        async function loadRequests() {
            const tbody = document.getElementById('requestsTableBody');
            tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4">جاري الجلب...</td></tr>`;

            const { data, error } = await supabaseClient
                .from('requests')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">فشل تحميل الطلبات.</td></tr>`;
                return;
            }

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">لا توجد طلبات مسجلة حتى الآن.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(req => {
                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold text-primary">${req.ticket_id}</td>
                        <td>${req.full_name}</td>
                        <td>${req.national_id}</td>
                        <td><span class="badge bg-light text-dark border">${req.sector}</span></td>
                        <td>${req.phone}</td>
                        <td>${new Date(req.created_at).toLocaleDateString('ar-EG')}</td>
                        <td><span class="badge bg-warning text-dark">${req.status || 'قيد المراجعة'}</span></td>
                    </tr>
                `;
            });
        }

        // تسجيل الخروج
        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }
    </script>
</body>
</html>
