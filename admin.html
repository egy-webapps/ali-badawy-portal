<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>لوحة مكتب النائب علي بدوي</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  body{font-family:'Cairo',sans-serif;background:#f4f6f9;color:#333}
  .topbar{background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff}
  .card-custom{border:none;border-radius:15px;box-shadow:0 4px 20px rgba(0,0,0,.05);background:#fff}
  .btn-main{background:#1e3c72;border:none;color:#fff;font-weight:700;border-radius:10px}
  .btn-main:hover{background:#2a5298;color:#fff}
  .req{cursor:pointer;border-radius:12px;border:1px solid #e6e9ef;background:#fff;padding:12px 14px;margin-bottom:10px}
  .req:hover{border-color:#2a5298}
  .req.new{border-right:5px solid #dc3545}
  .st{font-size:.8rem}
  .details-text{white-space:pre-wrap}
  .link-box{font-size:.7rem;color:#6c757d;word-break:break-all;direction:ltr;text-align:left}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.85rem}
  .bar-label{width:95px;flex-shrink:0}
  .bar-track{flex:1;background:#eef2f7;border-radius:8px;height:18px;overflow:hidden}
  .bar-fill{height:100%;background:linear-gradient(90deg,#1e3c72,#2a5298);border-radius:8px;min-width:2px}
  .bar-num{width:28px;text-align:left;font-weight:700}
</style>
</head>
<body>

<div id="loginView" class="container py-5 d-none" style="max-width:420px">
  <div class="card card-custom p-4">
    <h4 class="fw-bold text-primary mb-3 text-center">دخول مكتب النائب</h4>
    <div class="mb-3">
      <label class="form-label fw-bold" for="email">البريد الإلكتروني</label>
      <input type="email" id="email" class="form-control" dir="ltr" autocomplete="username">
    </div>
    <div class="mb-3">
      <label class="form-label fw-bold" for="password">كلمة المرور</label>
      <input type="password" id="password" class="form-control" dir="ltr" autocomplete="current-password">
    </div>
    <div id="loginError" class="alert alert-danger d-none"></div>
    <button id="loginBtn" class="btn btn-main w-100 py-2">دخول</button>
  </div>
</div>

<div id="appView" class="d-none">
  <div class="topbar py-3 mb-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h5 class="mb-0 fw-bold">طلبات المواطنين</h5>
      <button id="logoutBtn" class="btn btn-sm btn-light fw-bold">خروج</button>
    </div>
  </div>

  <div class="container pb-5">

    <div class="row g-2 mb-3">
      <div class="col-6">
        <div class="card card-custom p-3 text-center h-100">
          <div class="fw-bold mb-1">رابط البوابة</div>
          <div class="link-box mb-2" id="portalLinkText"></div>
          <button class="btn btn-main btn-sm w-100" id="copyPortal">نسخ الرابط</button>
        </div>
      </div>
      <div class="col-6">
        <div class="card card-custom p-3 text-center h-100">
          <div class="fw-bold mb-1">رابط لوحة الأدمن</div>
          <div class="link-box mb-2" id="adminLinkText"></div>
          <button class="btn btn-main btn-sm w-100" id="copyAdmin">نسخ الرابط</button>
        </div>
      </div>
    </div>

    <div class="row g-2 mb-3" id="stats"></div>

    <div class="card card-custom p-3 mb-3">
      <div class="fw-bold mb-3">الطلبات حسب القطاع</div>
      <div id="chart"></div>
    </div>

    <div class="card card-custom p-3 mb-3">
      <div class="row g-2">
        <div class="col-12 col-md-4"><input id="search" class="form-control" placeholder="بحث بالاسم أو الرقم القومي أو الهاتف أو الرقم المرجعي"></div>
        <div class="col-6 col-md-2">
          <select id="fStatus" class="form-select">
            <option value="">كل الحالات</option>
            <option>جديد</option><option>قيد المراجعة</option><option>تمت الإحالة</option><option>تم الحل</option><option>مرفوض</option>
          </select>
        </div>
        <div class="col-6 col-md-3">
          <select id="fSector" class="form-select">
            <option value="">كل القطاعات</option>
            <option>صحة</option><option>طرق ومرافق</option><option>تعليم</option><option>خدمات اجتماعية</option><option>تموين وزراعة</option><option>توظيف</option><option>أخرى</option>
          </select>
        </div>
        <div class="col-6 col-md-1"><button id="refreshBtn" class="btn btn-outline-primary w-100" title="تحديث">↻</button></div>
        <div class="col-6 col-md-2"><button id="exportBtn" class="btn btn-success w-100 fw-bold">تصدير Excel</button></div>
      </div>
    </div>

    <div id="list"></div>
  </div>
</div>

<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content" style="border-radius:16px">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="mTicket" dir="ltr"></h5>
        <button class="btn-close ms-0 me-auto" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="mInfo" class="mb-3"></div>
        <div class="mb-3"><strong>التفاصيل:</strong><div id="mDetails" class="details-text mt-1 p-2 bg-light rounded"></div></div>
        <div id="mFile" class="mb-3"></div>
        <label class="form-label fw-bold" for="mStatus">الحالة</label>
        <select id="mStatus" class="form-select mb-3">
          <option>جديد</option><option>قيد المراجعة</option><option>تمت الإحالة</option><option>تم الحل</option><option>مرفوض</option>
        </select>
        <label class="form-label fw-bold" for="mNote">رد المكتب (يظهر للمواطن عند الاستعلام)</label>
        <textarea id="mNote" class="form-control" rows="3" maxlength="1000"></textarea>
        <div id="mMsg" class="small mt-2"></div>
      </div>
      <div class="modal-footer">
        <a id="mWhats" class="btn btn-success" target="_blank" rel="noopener">واتساب</a>
        <button id="mPrint" class="btn btn-outline-secondary">طباعة</button>
        <button id="mSave" class="btn btn-main px-4">حفظ</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://qnkdfrxavrztgyhrodxl.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_xGfJoG2Cuxj9T-B6dC_gnw_FwFAwo78';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  let all = [], current = null, channel = null;
  const modal = new bootstrap.Modal($('detailModal'));
  const SECTORS = ['صحة', 'طرق ومرافق', 'تعليم', 'خدمات اجتماعية', 'تموين وزراعة', 'توظيف', 'أخرى'];

  const badge = s => ({ 'جديد':'danger','قيد المراجعة':'warning text-dark','تمت الإحالة':'info text-dark','تم الحل':'success','مرفوض':'secondary' }[s] || 'secondary');
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const fmt = d => new Date(d).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

  // ----- الروابط -----
  const base = location.href.split('#')[0].split('?')[0].replace(/admin\.html$/, '');
  const PORTAL_URL = base;
  const ADMIN_URL = base + 'admin.html';
  $('portalLinkText').textContent = PORTAL_URL;
  $('adminLinkText').textContent = ADMIN_URL;

  async function copyLink(url, btn){
    const old = btn.textContent;
    try {
      await navigator.clipboard.writeText(url);
      btn.textContent = 'تم النسخ ✓';
    } catch {
      window.prompt('انسخ الرابط من هنا:', url);
      return;
    }
    setTimeout(() => btn.textContent = old, 1800);
  }
  $('copyPortal').addEventListener('click', e => copyLink(PORTAL_URL, e.target));
  $('copyAdmin').addEventListener('click', e => copyLink(ADMIN_URL, e.target));

  // ----- الدخول -----
  async function init(){
    const { data } = await sb.auth.getSession();
    data.session ? startApp() : showLogin();
  }
  function showLogin(){ $('appView').classList.add('d-none'); $('loginView').classList.remove('d-none'); }
  async function startApp(){
    $('loginView').classList.add('d-none'); $('appView').classList.remove('d-none');
    await load();
    if (channel) sb.removeChannel(channel);
    channel = sb.channel('requests-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'requests' }, () => load())
      .subscribe();
  }

  $('loginBtn').addEventListener('click', async () => {
    const err = $('loginError'); err.classList.add('d-none');
    const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    if (error) { err.textContent = 'البريد أو كلمة المرور غير صحيحة.'; err.classList.remove('d-none'); return; }
    $('password').value = '';
    startApp();
  });
  $('password').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
  $('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); if (channel) sb.removeChannel(channel); showLogin(); });

  // ----- تحميل -----
  async function load(){
    const { data, error } = await sb.from('requests').select('*').order('created_at', { ascending: false });
    if (error) { $('list').replaceChildren(el('div', 'alert alert-danger', 'تعذّر تحميل الطلبات: ' + error.message)); return; }
    all = data; render();
  }

  // ----- الحذف -----
  async function deleteRequest(r){
    const ok = window.confirm(`هتحذف طلب "${r.full_name}" (${r.ticket}) نهائيًا ولا يمكن استرجاعه.\nمتأكد؟`);
    if (!ok) return;
    const { data, error } = await sb.from('requests').delete().eq('id', r.id).select();
    if (error) { window.alert('فشل الحذف: ' + error.message); return; }
    if (!data || !data.length) { window.alert('الحذف لم يتم. تأكد إنك شغّلت كود صلاحية الحذف في Supabase.'); return; }
    if (r.attachment) { await sb.storage.from('attachments').remove([r.attachment]); }
    await load();
  }

  // ----- الفلترة -----
  function getFiltered(){
    const q = $('search').value.trim().toLowerCase();
    const fs = $('fStatus').value, fc = $('fSector').value;
    return all.filter(r =>
      (!fs || r.status === fs) && (!fc || r.sector === fc) &&
      (!q || [r.full_name, r.national_id, r.phone, r.ticket, r.location].some(x => (x || '').toLowerCase().includes(q)))
    );
  }

  // ----- الرسم البياني -----
  function renderChart(){
    const chart = $('chart'); chart.replaceChildren();
    const counts = {};
    SECTORS.forEach(s => counts[s] = 0);
    all.forEach(r => { counts[r.sector] = (counts[r.sector] || 0) + 1; });
    const max = Math.max(1, ...Object.values(counts));
    Object.entries(counts).forEach(([name, n]) => {
      const row = el('div', 'bar-row');
      const track = el('div', 'bar-track');
      const fill = el('div', 'bar-fill'); fill.style.width = (n / max * 100) + '%';
      track.appendChild(fill);
      row.append(el('div', 'bar-label', name), track, el('div', 'bar-num', n));
      chart.appendChild(row);
    });
  }

  // ----- العرض -----
  function render(){
    const counts = { 'جديد':0, 'قيد المراجعة':0, 'تمت الإحالة':0, 'تم الحل':0 };
    all.forEach(r => { if (r.status in counts) counts[r.status]++; });
    const stats = $('stats'); stats.replaceChildren();
    [['الإجمالي', all.length, 'primary'], ['جديد', counts['جديد'], 'danger'], ['قيد المراجعة', counts['قيد المراجعة'], 'warning'], ['تم الحل', counts['تم الحل'], 'success']].forEach(([k, v, c]) => {
      const col = el('div', 'col-6 col-md-3');
      const card = el('div', 'card card-custom p-3 text-center');
      card.append(el('div', 'fs-3 fw-bold text-' + c, v), el('div', 'small text-muted', k));
      col.appendChild(card); stats.appendChild(col);
    });

    renderChart();

    const rows = getFiltered();
    const list = $('list'); list.replaceChildren();
    if (!rows.length) { list.appendChild(el('div', 'text-center text-muted py-5', 'لا توجد طلبات مطابقة.')); return; }

    rows.forEach(r => {
      const d = el('div', 'req' + (r.status === 'جديد' ? ' new' : ''));
      const top = el('div', 'd-flex justify-content-between align-items-center mb-1');
      top.append(el('strong', '', r.full_name), el('span', 'badge st bg-' + badge(r.status), r.status));
      const mid = el('div', 'small text-muted', `${r.sector} • ${r.location} • ${r.phone}`);
      const det = el('div', 'small mt-1', r.details.length > 90 ? r.details.slice(0, 90) + '…' : r.details);
      const bot = el('div', 'small text-muted mt-1'); bot.dir = 'ltr'; bot.style.textAlign = 'right';
      bot.textContent = `${r.ticket} — ${fmt(r.created_at)}`;

      const actions = el('div', 'mt-2 pt-2 border-top');
      const del = el('button', 'btn btn-sm btn-outline-danger fw-bold', 'حذف');
      del.type = 'button';
      del.addEventListener('click', ev => { ev.stopPropagation(); deleteRequest(r); });
      actions.appendChild(del);

      d.append(top, mid, det, bot, actions);
      d.addEventListener('click', () => openDetail(r));
      list.appendChild(d);
    });
  }

  ['search', 'fStatus', 'fSector'].forEach(id => $(id).addEventListener('input', render));
  $('refreshBtn').addEventListener('click', load);

  // ----- التصدير إلى Excel (CSV) -----
  function csvCell(v, asText){
    let s = String(v == null ? '' : v).replace(/\r?\n/g, ' ');
    if (asText) s = '\t' + s;
    else if (/^[=+\-@]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  }
  $('exportBtn').addEventListener('click', () => {
    const rows = getFiltered();
    if (!rows.length) { window.alert('لا توجد طلبات لتصديرها.'); return; }
    const head = ['الرقم المرجعي', 'الاسم', 'الرقم القومي', 'الهاتف', 'المنطقة', 'القطاع', 'التفاصيل', 'الحالة', 'رد المكتب', 'التاريخ'];
    const lines = [head.map(h => csvCell(h)).join(',')];
    rows.forEach(r => {
      lines.push([
        csvCell(r.ticket), csvCell(r.full_name), csvCell(r.national_id, true), csvCell(r.phone, true),
        csvCell(r.location), csvCell(r.sector), csvCell(r.details), csvCell(r.status),
        csvCell(r.admin_note), csvCell(fmt(r.created_at))
      ].join(','));
    });
    const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'requests-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });

  // ----- الطباعة -----
  function printRequest(r){
    const status = $('mStatus').value, note = $('mNote').value.trim();
    const w = window.open('', '_blank');
    if (!w) { window.alert('اسمح بالنوافذ المنبثقة للمتصفح عشان تقدر تطبع.'); return; }
    const row = (k, v) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`;
    w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>${esc(r.ticket)}</title>
<style>
  body{font-family:Tahoma,Arial,sans-serif;padding:28px;color:#111}
  h1{font-size:20px;text-align:center;margin:0 0 4px}
  h2{font-size:15px;text-align:center;margin:0 0 20px;font-weight:normal;color:#444}
  table{width:100%;border-collapse:collapse;margin-bottom:16px}
  th,td{border:1px solid #888;padding:8px 10px;text-align:right;vertical-align:top;font-size:14px}
  th{width:28%;background:#f0f0f0}
  td{white-space:pre-wrap}
  .sign{margin-top:40px;display:flex;justify-content:space-between;font-size:14px}
</style></head><body>
<h1>مكتب النائب / علي بدوي</h1>
<h2>بيان طلب مواطن</h2>
<table>
${row('الرقم المرجعي', r.ticket)}
${row('تاريخ التقديم', fmt(r.created_at))}
${row('الاسم', r.full_name)}
${row('الرقم القومي', r.national_id)}
${row('الهاتف', r.phone)}
${row('المركز / القرية', r.location)}
${row('القطاع', r.sector)}
${row('الحالة', status)}
${row('تفاصيل الطلب', r.details)}
${note ? row('رد المكتب', note) : ''}
</table>
<div class="sign"><div>توقيع المسؤول: ................</div><div>التاريخ: ................</div></div>
<script>window.onload=function(){window.print();}<\/script>
</body></html>`);
    w.document.close();
  }
  $('mPrint').addEventListener('click', () => { if (current) printRequest(current); });

  // ----- رسالة واتساب جاهزة -----
  $('mWhats').addEventListener('click', e => {
    if (!current) return;
    const ph = current.phone.replace(/^0/, '20');
    const note = $('mNote').value.trim();
    let text = `مكتب النائب علي بدوي:\nبخصوص طلبكم رقم ${current.ticket}، حالته الآن: ${$('mStatus').value}.`;
    if (note) text += `\nرد المكتب: ${note}`;
    e.currentTarget.href = `https://wa.me/${ph}?text=${encodeURIComponent(text)}`;
  });

  // ----- التفاصيل -----
  async function openDetail(r){
    current = r;
    $('mTicket').textContent = r.ticket;
    const info = $('mInfo'); info.replaceChildren();
    [['الاسم', r.full_name], ['الرقم القومي', r.national_id], ['الهاتف', r.phone], ['المنطقة', r.location], ['القطاع', r.sector], ['التاريخ', fmt(r.created_at)]].forEach(([k, v]) => {
      const p = el('div', 'mb-1'); p.append(el('strong', '', k + ': '), document.createTextNode(v)); info.appendChild(p);
    });
    $('mDetails').textContent = r.details;
    $('mStatus').value = r.status;
    $('mNote').value = r.admin_note || '';
    $('mMsg').textContent = '';
    $('mWhats').href = 'https://wa.me/' + r.phone.replace(/^0/, '20');

    const f = $('mFile'); f.replaceChildren();
    if (r.attachment) {
      const { data, error } = await sb.storage.from('attachments').createSignedUrl(r.attachment, 300);
      if (!error && data) {
        const a = el('a', 'btn btn-outline-primary btn-sm', 'فتح المرفق');
        a.href = data.signedUrl; a.target = '_blank'; a.rel = 'noopener'; f.appendChild(a);
      } else f.appendChild(el('span', 'text-danger small', 'تعذّر تحميل المرفق'));
    }
    modal.show();
  }

  $('mSave').addEventListener('click', async () => {
    const msg = $('mMsg');
    const { error } = await sb.from('requests')
      .update({ status: $('mStatus').value, admin_note: $('mNote').value.trim() || null })
      .eq('id', current.id);
    if (error) { msg.className = 'small mt-2 text-danger'; msg.textContent = 'فشل الحفظ: ' + error.message; return; }
    msg.className = 'small mt-2 text-success'; msg.textContent = 'تم الحفظ ✓';
    await load();
  });

  init();
</script>
</body>
          </html>
